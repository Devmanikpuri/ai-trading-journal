<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Journal Tracker</title><style>body{margin:0;font:14px system-ui;background:#f5f7fb;color:#182033}.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{margin:0}.muted{color:#718096}.nav{display:flex;gap:8px;margin:18px 0}.nav button,.btn{border:1px solid #d8deea;background:white;border-radius:9px;padding:9px 13px;cursor:pointer}.nav button.active,.primary{background:#4f46e5;color:white;border-color:#4f46e5}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:15px;box-shadow:0 2px 8px #1720330a}.metric small{color:#718096}.metric strong{display:block;font-size:21px;margin-top:6px}.green{color:#07845f}.red{color:#d13c50}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px;margin-top:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:#667085}input,select,textarea{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #d8deea;border-radius:8px;background:#fff}textarea{min-height:70px}.full{grid-column:1/-1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#7b8496;font-size:11px;padding:5px}.day{min-height:72px;border:1px solid #e2e7ef;border-radius:9px;padding:7px;background:#fff}.day .num{font-size:11px;color:#718096}.day .amt{font-weight:700;margin-top:10px}.pos{background:#effcf7}.neg{background:#fff1f3}.flat{background:#f7f8fa}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.monthbar button{border:1px solid #d8deea;background:white;border-radius:7px;padding:6px 10px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e9f0;font-size:12px}.tag{padding:3px 7px;border-radius:20px;background:#eef1f7}.hidden{display:none}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center}.modal>div{background:white;border-radius:14px;padding:20px;width:min(430px,90%)}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.app{padding:12px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:58px;padding:5px}.day .amt{font-size:11px;margin-top:6px}}</style></head><body><main class="app"><header class="top"><div class="brand"><h1>📒 Trading Journal Tracker</h1><div class="muted">Daily P&L • Weekly • Monthly performance</div></div><button class="btn primary" onclick="showModal()">+ New Portfolio</button></header><div class="nav"><select id="portfolio" onchange="load()"></select><button data-view="dashboard" class="active" onclick="view('dashboard')">Dashboard</button><button data-view="daily" onclick="view('daily')">Daily</button><button data-view="weekly" onclick="view('weekly')">Weekly</button><button data-view="monthly" onclick="view('monthly')">Month</button></div><div id="dashboard"></div><div id="daily" class="hidden"></div><div id="weekly" class="hidden"></div><div id="monthly" class="hidden"></div></main><div id="modal" class="modal hidden"><div><h2>Create portfolio</h2><form id="pf"><label>Name<input id="pname" placeholder="Main Trading Account" required></label><br><label>Initial capital<input id="capital" type="number" min="0" step="any" placeholder="100000" required></label><br><label>Currency<select id="currency"><option>INR</option><option>USD</option><option>EUR</option></select></label><br><button class="btn primary">Create</button> <button type="button" class="btn" onclick="hideModal()">Cancel</button></form></div></div><script>const $=x=>document.getElementById(x);let portfolios=[],current=null,data=null,active='dashboard',month=new Date(),week=new Date();const money=n=>{let c=current?.currency||'INR';return new Intl.NumberFormat('en-IN',{style:'currency',currency:c,maximumFractionDigits:2}).format(n||0)};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.error||'Request failed')}return r.status===204?null:r.json()}async function init(){portfolios=await api('/api/portfolios');if(!portfolios.length){$('portfolio').innerHTML='<option>No portfolio yet</option>';showModal();return}$('portfolio').innerHTML=portfolios.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.initial_capital)}</option>`).join('');current=portfolios[0];$('portfolio').value=current.id;await load()}async function load(){current=portfolios.find(p=>p.id==$('portfolio').value)||current;if(!current)return;data=await api('/api/portfolios/'+current.id+'/summary');renderAll()}function nav(title,body){return `<section class="card"><div class="monthbar"><h2>${title}</h2></div>${body}</section>`}function stats(){return `<div class="cards"><div class="card metric"><small>Initial capital</small><strong>${money(current.initial_capital)}</strong></div><div class="card metric"><small>Current balance</small><strong class="${data.balance>=current.initial_capital?'green':'red'}">${money(data.balance)}</strong></div><div class="card metric"><small>Total P&L</small><strong class="${data.netPnl>=0?'green':'red'}">${money(data.netPnl)}</strong></div><div class="card metric"><small>Total return</small><strong class="${data.totalReturnPct>=0?'green':'red'}">${data.totalReturnPct.toFixed(2)}%</strong></div><div class="card metric"><small>Winning days</small><strong>${data.winningDays}</strong></div><div class="card metric"><small>Losing days</small><strong>${data.losingDays}</strong></div></div>`}function renderDashboard(){let recent=data.entries.slice(-10).reverse();$('dashboard').innerHTML=stats()+`<div class="grid"><div>${nav('Quick entry',`<form id="entryForm" class="form"><label>Date<input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Daily P&L<input id="amount" type="number" step="any" placeholder="+2500 or -1200" required></label><label class="full">Notes<textarea id="enotes" placeholder="Optional note"></textarea></label><button class="btn primary full">Save day</button></form><p class="muted">Saving the same date updates that day's result.</p>`)}</div><div>${nav('Recent performance',`<div class="table"><table><thead><tr><th>Date</th><th>P&L</th><th>Balance</th><th>Return</th></tr></thead><tbody>${recent.length?recent.map(e=>`<tr><td>${e.date}</td><td class="${e.amount>=0?'green':'red'}">${money(e.amount)}</td><td>${money(e.balance)}</td><td>${e.returnPct.toFixed(2)}%</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No daily entries yet.</td></tr>'}</tbody></table></div>`)}</div></div>`;$('entryForm').onsubmit=saveEntry}function calendar(entries,y,m,clickable=true){let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),map=Object.fromEntries(entries.map(e=>[e.date,e]));let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=map[key];h+=`<div class="day ${e?(e.amount>0?'pos':e.amount<0?'neg':'flat'):''}" ${clickable?`onclick="pickDate('${key}')"`:''}><div class="num">${d}</div><div class="amt">${e?money(e.amount):'—'}</div></div>`}return `<div class="calendar">${h}</div>`}function renderDaily(){let now=month,y=now.getFullYear(),m=now.getMonth(),es=data.entries.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));$('daily').innerHTML=nav('Daily performance',`<div class="monthbar"><button onclick="moveMonth(-1)">←</button><b>${now.toLocaleString('en',{month:'long',year:'numeric'})}</b><button onclick="moveMonth(1)">→</button></div>${calendar(es,y,m)}<p class="muted">Tap a date to edit its daily P&L.</p>`)}function weekStart(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}function renderWeekly(){let s=weekStart(week),keys=[];for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);keys.push(d.toISOString().slice(0,10))}let es=data.entries.filter(e=>keys.includes(e.date));let total=es.reduce((a,e)=>a+e.amount,0);$('weekly').innerHTML=nav('Weekly performance',`<div class="monthbar"><button onclick="moveWeek(-7)">←</button><b>${keys[0]} → ${keys[6]}</b><button onclick="moveWeek(7)">→</button></div>${calendarWeek(es,keys)}<h3 class="${total>=0?'green':'red'}">Week P&L: ${money(total)}</h3>`)}function calendarWeek(es,keys){let map=Object.fromEntries(es.map(e=>[e.date,e]));return `<div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}${keys.map(k=>{let e=map[k];return `<div class="day ${e?(e.amount>=0?'pos':'neg'):''}" onclick="pickDate('${k}')"><div class="num">${k}</div><div class="amt">${e?money(e.amount):'—'}</div></div>`}).join('')}</div>`}function renderMonthly(){let groups={};data.entries.forEach(e=>{let k=e.date.slice(0,7);groups[k]??=[];groups[k].push(e)});let months=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));$('monthly').innerHTML=nav('Monthly performance',`<div class="cards">${months.length?months.map(([k,es])=>{let n=es.reduce((a,e)=>a+e.amount,0),w=es.filter(e=>e.amount>0).length,l=es.filter(e=>e.amount<0).length;return `<div class="card"><b>${new Date(k+'-01').toLocaleString('en',{month:'long',year:'numeric'})}</b><div class="metric"><strong class="${n>=0?'green':'red'}">${money(n)}</strong><small>${n>=0?'Profit':'Loss'} • ${w}W / ${l}L</small></div></div>`}).join(''):'<p class="muted">No monthly data yet.</p>'}</div><hr><p class="muted">Month cards summarize all daily entries. Use Daily or Weekly to drill into individual days.</p>`)}function renderAll(){renderDashboard();renderDaily();renderWeekly();renderMonthly();view(active)}function view(v){active=v;['dashboard','daily','weekly','monthly'].forEach(x=>$(x).classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}async function saveEntry(e){e.preventDefault();try{await api('/api/portfolios/'+current.id+'/entries',{method:'POST',body:JSON.stringify({date:$('edate').value,amount:+$('amount').value,notes:$('enotes').value})});await load();alert('Daily performance saved.')}catch(x){alert(x.message)}}function pickDate(k){view('dashboard');setTimeout(()=>{$('edate').value=k;$('amount').focus()},0)}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);renderDaily()}function moveWeek(n){week=new Date(week);week.setDate(week.getDate()+n);renderWeekly()}function showModal(){$('modal').classList.remove('hidden')}function hideModal(){$('modal').classList.add('hidden')}$('pf').onsubmit=async e=>{e.preventDefault();try{let p=await api('/api/portfolios',{method:'POST',body:JSON.stringify({name:$('pname').value,initialCapital:+$('capital').value,currency:$('currency').value})});hideModal();await init();current=p;$('portfolio').value=p.id;await load()}catch(x){alert(x.message)}};init().catch(x=>alert(x.message));</script></body></html>
