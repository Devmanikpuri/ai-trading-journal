<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Trading Journal</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eee}.app{max-width:1100px;margin:auto;padding:24px}.card{background:#121a2b;border:1px solid #26314b;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;background:#0c1323;color:#eee;border:1px solid #303b57;border-radius:8px;padding:9px;margin-top:4px}textarea{min-height:70px}button{background:#6c5ce7;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.muted{color:#8994ad}.green{color:#39d6a2}.red{color:#ff7180}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #26314b;text-align:left;font-size:13px}@media(max-width:750px){.grid,.layout,.form{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🤖 AI Trading Journal</h1><p class="muted">Track trades, measure performance and learn from your patterns.</p><section id="stats" class="grid"></section><div class="layout"><section class="card"><h2>Log trade</h2><form id="f" class="form"><label>Date<input id="date" type="date" required></label><label>Symbol<input id="symbol" placeholder="NIFTY / BTC / AAPL" required></label><label>Direction<select id="side"><option>Long</option><option>Short</option></select></label><label>Setup<select id="setup"><option>Breakout</option><option>Trend</option><option>Reversal</option><option>Support/Resistance</option><option>Other</option></select></label><label>Entry<input id="entry" type="number" step="any" required></label><label>Exit<input id="exit" type="number" step="any" required></label><label>Quantity<input id="qty" type="number" step="any" value="1" required></label><label>Risk ₹<input id="risk" type="number" step="any" value="0"></label><label>Emotion<select id="emotion"><option>Calm</option><option>Confident</option><option>Fearful</option><option>Greedy</option><option>FOMO</option><option>Revenge</option></select></label><label>Notes<textarea id="notes" placeholder="Why did you enter? What did you learn?"></textarea></label><button type="submit">Save trade</button></form></section><section class="card"><h2>AI Trade Coach</h2><button onclick="analyze()">Analyze journal</button><div id="ai" class="muted"><p>Add trades and run analysis.</p></div><p class="muted">Educational insights only, not financial advice.</p></section></div><section class="card"><div style="display:flex;justify-content:space-between"><h2>Trade history</h2><button onclick="clearAll()">Clear all</button></div><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Setup</th><th>P&L</th><th>R</th><th>Emotion</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><p class="muted" style="text-align:center;font-size:12px">MVP • Data stored locally in your browser</p></main><script>const K='aitj-v1';let t=JSON.parse(localStorage.getItem(K)||'[]');const $=x=>document.getElementById(x);$('date').value=new Date().toISOString().slice(0,10);const pnl=x=>(x.side==='Long'?x.exit-x.entry:x.entry-x.exit)*x.qty;const money=x=>'₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2});function save(){localStorage.setItem(K,JSON.stringify(t));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let p=t.map(pnl),wins=p.filter(x=>x>0),net=p.reduce((a,b)=>a+b,0),wr=t.length?wins.length/t.length*100:0,ar=t.reduce((a,x)=>a+(x.risk?pnl(x)/x.risk:0),0)/(t.length||1);$('stats').innerHTML=`<div class="card"><small>Total trades</small><h2>${t.length}</h2></div><div class="card"><small>Net P&L</small><h2 class="${net>=0?'green':'red'}">${money(net)}</h2></div><div class="card"><small>Win rate</small><h2>${wr.toFixed(1)}%</h2></div><div class="card"><small>Avg R</small><h2>${ar.toFixed(2)}R</h2></div>`;$('rows').innerHTML=t.length?t.slice().reverse().map((x,i)=>{let n=pnl(x),r=x.risk?n/x.risk:0;return `<tr><td>${x.date}</td><td>${esc(x.symbol)}</td><td>${x.side}</td><td>${x.setup}</td><td class="${n>=0?'green':'red'}">${money(n)}</td><td>${r.toFixed(2)}R</td><td>${x.emotion}</td><td><button onclick="del(${t.length-1-i})">Delete</button></td></tr>`}).join(''):'<tr><td colspan="8" class="muted">No trades yet.</td></tr>'}$('f').onsubmit=e=>{e.preventDefault();t.push({date:$('date').value,symbol:$('symbol').value.trim().toUpperCase(),side:$('side').value,setup:$('setup').value,entry:+$('entry').value,exit:+$('exit').value,qty:+$('qty').value,risk:+$('risk').value,emotion:$('emotion').value,notes:$('notes').value});save();e.target.reset();$('date').value=new Date().toISOString().slice(0,10)};function del(i){t.splice(i,1);save()}function clearAll(){if(confirm('Delete all trades?')){t=[];save();$('ai').innerHTML='<p>Add trades and run analysis.</p>'}}function analyze(){if(!t.length){$('ai').innerHTML='<p>No trades to analyze.</p>';return}let p=t.map(pnl),w=p.filter(x=>x>0),l=p.filter(x=>x<0),net=p.reduce((a,b)=>a+b,0),wr=w.length/t.length*100,aw=w.length?w.reduce((a,b)=>a+b,0)/w.length:0,al=l.length?Math.abs(l.reduce((a,b)=>a+b,0)/l.length):0,em={};t.forEach(x=>{em[x.emotion]??={n:0,p:0};em[x.emotion].n++;em[x.emotion].p+=pnl(x)});let best=Object.entries(em).sort((a,b)=>b[1].p-a[1].p)[0],tips=[];if(wr<50)tips.push('Win rate is below 50%: be more selective and review losing setups.');if(aw&&al>aw)tips.push('Average loss exceeds average win: review stop placement and position sizing.');if(t.some(x=>['FOMO','Revenge','Greedy'].includes(x.emotion)))tips.push('Emotional trades detected: add a pre-trade checklist and daily loss limit.');if(best)tips.push(`Best emotional state by P&L: ${best[0]} (${money(best[1].p)}).`);if(!tips.length)tips.push('Keep collecting data before changing your strategy.');$('ai').innerHTML=`<p><b>Journal snapshot:</b> Net ${money(net)} • Win rate ${wr.toFixed(1)}% • Avg win ${money(aw)} • Avg loss ${money(al)}</p>`+tips.map(x=>`<div class="card">💡 ${esc(x)}</div>`).join('')}render();</script></body></html>
