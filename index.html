<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Trading Journal Tracker</title><style>
:root{--bg:#07101f;--panel:rgba(16,28,49,.78);--panel2:#101d33;--line:rgba(148,163,184,.16);--text:#eef5ff;--muted:#8fa2bd;--accent:#6d5dfc;--accent2:#21d4a3;--danger:#ff647c;--shadow:0 18px 55px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,rgba(109,93,252,.18),transparent 32%),radial-gradient(circle at 90% 10%,rgba(33,212,163,.12),transparent 30%),var(--bg)}button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:-.7px}.brand .muted{margin-top:5px}.muted{color:var(--muted)}.nav{display:flex;gap:8px;margin:20px 0;overflow-x:auto;padding-bottom:3px}.nav select,.nav button,.btn{border:1px solid var(--line);background:rgba(16,29,51,.85);color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer;transition:.2s}.nav select{min-width:170px}.nav button:hover,.btn:hover{transform:translateY(-1px);border-color:rgba(109,93,252,.65)}.nav button.active,.primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:white;border-color:transparent;box-shadow:0 8px 22px rgba(109,93,252,.25)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:linear-gradient(145deg,rgba(17,30,52,.9),rgba(10,20,36,.9));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.metric small{color:var(--muted)}.metric strong{display:block;font-size:21px;margin-top:7px;letter-spacing:-.3px}.green{color:var(--accent2)}.red{color:var(--danger)}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px;margin-top:15px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#091527;color:var(--text);outline:none;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,93,252,.12)}textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:6px}.day{min-height:78px;border:1px solid var(--line);border-radius:11px;padding:8px;background:rgba(9,21,39,.72);transition:.18s;cursor:pointer}.day:hover{transform:translateY(-2px);border-color:rgba(109,93,252,.55)}.day .num{font-size:11px;color:var(--muted)}.day .amt{font-weight:750;margin-top:12px;font-size:12px;overflow:hidden;text-overflow:ellipsis}.pos{background:linear-gradient(145deg,rgba(33,212,163,.13),rgba(9,21,39,.72));border-color:rgba(33,212,163,.28)}.neg{background:linear-gradient(145deg,rgba(255,100,124,.13),rgba(9,21,39,.72));border-color:rgba(255,100,124,.28)}.flat{background:rgba(148,163,184,.06)}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.monthbar button{border:1px solid var(--line);background:#0b182c;color:var(--text);border-radius:8px;padding:7px 11px;cursor:pointer}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{color:var(--muted);font-weight:600}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(2,8,18,.76);display:grid;place-items:center;padding:18px;z-index:100;backdrop-filter:blur(8px)}.modal.hidden{display:none!important}.modal>div{background:linear-gradient(145deg,#12223b,#0b172a);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(440px,100%);box-shadow:0 30px 90px rgba(0,0,0,.45)}.modal h2{margin-top:0}.modal-actions{display:flex;gap:8px;margin-top:14px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#13243d;border:1px solid var(--line);padding:11px 15px;border-radius:12px;z-index:200;transition:.25s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{padding:14px}.grid{grid-template-columns:1fr}.top .primary{width:100%}.nav{margin:14px 0}.nav select{min-width:150px}.calendar{gap:4px}.day{min-height:64px;padding:6px}.day .amt{font-size:10px;margin-top:8px}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.day{min-height:58px;border-radius:8px}.dow{font-size:9px}.brand h1{font-size:22px}.card{padding:14px}.modal>div{padding:18px}.modal-actions .btn{flex:1}}
</style></head><body><main class="app"><header class="top"><div class="brand"><h1>📒 Trading Journal</h1><div class="muted">Track your capital, daily P&amp;L and performance.</div></div><button class="btn primary" onclick="showModal()">＋ New Portfolio</button></header><div class="nav"><select id="portfolio" onchange="load()"></select><button data-view="dashboard" class="active" onclick="view('dashboard')">Dashboard</button><button data-view="daily" onclick="view('daily')">Daily</button><button data-view="weekly" onclick="view('weekly')">Weekly</button><button data-view="monthly" onclick="view('monthly')">Month</button></div><div id="dashboard"></div><div id="daily" class="hidden"></div><div id="weekly" class="hidden"></div><div id="monthly" class="hidden"></div></main><div id="modal" class="modal hidden"><div><h2>Create portfolio</h2><p class="muted">Set up an account to start tracking performance.</p><form id="pf"><label>Name<input id="pname" placeholder="Main Trading Account" required></label><br><label>Initial capital<input id="capital" type="number" min="0" step="any" placeholder="100000" required></label><br><label>Currency<select id="currency"><option>INR</option><option>USD</option><option>EUR</option></select></label><div class="modal-actions"><button class="btn primary" type="submit">Create Portfolio</button><button type="button" class="btn" onclick="hideModal()">Cancel</button></div></form></div></div><div id="toast" class="toast"></div><script>
const $=x=>document.getElementById(x);let portfolios=[],current=null,data=null,active='dashboard',month=new Date(),week=new Date();const money=n=>{let c=current?.currency||'INR';return new Intl.NumberFormat(c==='INR'?'en-IN':'en-US',{style:'currency',currency:c,maximumFractionDigits:2}).format(n||0)};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.error||'Request failed')}return r.status===204?null:r.json()}function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}async function init(){portfolios=await api('/api/portfolios');if(!portfolios.length){$('portfolio').innerHTML='<option>No portfolio yet</option>';showModal();return}setPortfolioOptions();current=portfolios[0];$('portfolio').value=current.id;await load()}function setPortfolioOptions(){$('portfolio').innerHTML=portfolios.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.initial_capital)}</option>`).join('')}async function load(){current=portfolios.find(p=>p.id==$('portfolio').value)||current;if(!current)return;data=await api('/api/portfolios/'+current.id+'/summary');renderAll()}function nav(title,body){return `<section class="card"><div class="monthbar"><h2>${title}</h2></div>${body}</section>`}function stats(){return `<div class="cards"><div class="card metric"><small>Initial capital</small><strong>${money(current.initial_capital)}</strong></div><div class="card metric"><small>Current balance</small><strong class="${data.balance>=current.initial_capital?'green':'red'}">${money(data.balance)}</strong></div><div class="card metric"><small>Total P&amp;L</small><strong class="${data.netPnl>=0?'green':'red'}">${money(data.netPnl)}</strong></div><div class="card metric"><small>Total return</small><strong class="${data.totalReturnPct>=0?'green':'red'}">${data.totalReturnPct.toFixed(2)}%</strong></div><div class="card metric"><small>Winning days</small><strong>${data.winningDays}</strong></div><div class="card metric"><small>Losing days</small><strong>${data.losingDays}</strong></div></div>`}function renderDashboard(){let recent=data.entries.slice(-10).reverse();$('dashboard').innerHTML=stats()+`<div class="grid"><div>${nav('Quick entry',`<form id="entryForm" class="form"><label>Date<input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Daily P&amp;L<input id="amount" type="number" step="any" placeholder="+2500 or -1200" required></label><label class="full">Notes<textarea id="enotes" placeholder="Optional note"></textarea></label><button class="btn primary full">Save day</button></form><p class="muted">Saving the same date updates that day's result.</p>`)}</div><div>${nav('Recent performance',`<div class="table"><table><thead><tr><th>Date</th><th>P&amp;L</th><th>Balance</th><th>Return</th></tr></thead><tbody>${recent.length?recent.map(e=>`<tr><td>${e.date}</td><td class="${e.amount>=0?'green':'red'}">${money(e.amount)}</td><td>${money(e.balance)}</td><td>${e.returnPct.toFixed(2)}%</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No daily entries yet.</td></tr>'}</tbody></table></div>`)}</div></div>`;$('entryForm').onsubmit=saveEntry}function calendar(entries,y,m){let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),map=Object.fromEntries(entries.map(e=>[e.date,e]));let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=map[key];h+=`<div class="day ${e?(e.amount>0?'pos':e.amount<0?'neg':'flat'):''}" onclick="pickDate('${key}')"><div class="num">${d}</div><div class="amt">${e?money(e.amount):'—'}</div></div>`}return `<div class="calendar">${h}</div>`}function renderDaily(){let now=month,y=now.getFullYear(),m=now.getMonth(),es=data.entries.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));$('daily').innerHTML=nav('Daily performance',`<div class="monthbar"><button onclick="moveMonth(-1)">←</button><b>${now.toLocaleString('en',{month:'long',year:'numeric'})}</b><button onclick="moveMonth(1)">→</button></div>${calendar(es,y,m)}<p class="muted">Tap any date to enter or update its daily P&amp;L.</p>`)}function weekStart(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}function renderWeekly(){let s=weekStart(week),keys=[];for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);keys.push(d.toISOString().slice(0,10))}let es=data.entries.filter(e=>keys.includes(e.date));let total=es.reduce((a,e)=>a+e.amount,0);$('weekly').innerHTML=nav('Weekly performance',`<div class="monthbar"><button onclick="moveWeek(-7)">←</button><b>${keys[0]} → ${keys[6]}</b><button onclick="moveWeek(7)">→</button></div>${calendarWeek(es,keys)}<h3 class="${total>=0?'green':'red'}">Week P&amp;L: ${money(total)}</h3>`)}function calendarWeek(es,keys){let map=Object.fromEntries(es.map(e=>[e.date,e]));return `<div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}${keys.map(k=>{let e=map[k];return `<div class="day ${e?(e.amount>=0?'pos':'neg'):''}" onclick="pickDate('${k}')"><div class="num">${k}</div><div class="amt">${e?money(e.amount):'—'}</div></div>`}).join('')}</div>`}function renderMonthly(){let groups={};data.entries.forEach(e=>{let k=e.date.slice(0,7);groups[k]??=[];groups[k].push(e)});let months=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));$('monthly').innerHTML=nav('Monthly performance',`<div class="cards">${months.length?months.map(([k,es])=>{let n=es.reduce((a,e)=>a+e.amount,0),w=es.filter(e=>e.amount>0).length,l=es.filter(e=>e.amount<0).length;return `<div class="card"><b>${new Date(k+'-01').toLocaleString('en',{month:'long',year:'numeric'})}</b><div class="metric"><strong class="${n>=0?'green':'red'}">${money(n)}</strong><small>${n>=0?'Profit':'Loss'} • ${w}W / ${l}L</small></div></div>`}).join(''):'<p class="muted">No monthly data yet.</p>'}</div><hr><p class="muted">Month cards summarize all daily entries. Use Daily or Weekly to drill into individual days.</p>`)}function renderAll(){renderDashboard();renderDaily();renderWeekly();renderMonthly();view(active)}function view(v){active=v;['dashboard','daily','weekly','monthly'].forEach(x=>$(x).classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}async function saveEntry(e){e.preventDefault();try{await api('/api/portfolios/'+current.id+'/entries',{method:'POST',body:JSON.stringify({date:$('edate').value,amount:+$('amount').value,notes:$('enotes').value})});await load();toast('Daily performance saved')}catch(x){toast(x.message)}}function pickDate(k){view('dashboard');setTimeout(()=>{$('edate').value=k;$('amount').focus()},0)}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);renderDaily()}function moveWeek(n){week=new Date(week);week.setDate(week.getDate()+n);renderWeekly()}function showModal(){$('modal').classList.remove('hidden');setTimeout(()=>$('pname').focus(),50)}function hideModal(){$('modal').classList.add('hidden')}$('pf').onsubmit=async e=>{e.preventDefault();let btn=e.submitter;try{btn.disabled=true;let p=await api('/api/portfolios',{method:'POST',body:JSON.stringify({name:$('pname').value.trim(),initialCapital:+$('capital').value,currency:$('currency').value})});hideModal();$('pf').reset();portfolios=await api('/api/portfolios');setPortfolioOptions();current=portfolios.find(x=>x.id===p.id)||p;$('portfolio').value=current.id;await load();toast('Portfolio created successfully')}catch(x){toast(x.message)}finally{btn.disabled=false}};init().catch(x=>toast(x.message));
</script></body></html>
