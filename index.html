<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Trading Journal Tracker</title><style>:root{--bg:#07101f;--panel:#101c31;--line:#26344d;--text:#eef5ff;--muted:#8fa2bd;--a:#6d5dfc;--g:#21d4a3;--r:#ff647c}*{box-sizing:border-box}body{margin:0;color:var(--text);font:14px Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,#6d5dfc2b,transparent 32%),radial-gradient(circle at 90% 10%,#21d4a31f,transparent 30%),var(--bg)}button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;padding:22px}.top,.nav,.monthbar,.section-head{display:flex;align-items:center;gap:10px}.top{justify-content:space-between;flex-wrap:wrap}.brand h1{margin:0;font-size:clamp(22px,4vw,30px)}.muted{color:var(--muted)}.nav{margin:18px 0;overflow:auto}.nav select,.nav button,.btn{border:1px solid var(--line);background:#101d33;color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer}.nav button.active,.primary{background:linear-gradient(135deg,var(--a),#8b5cf6);border-color:transparent;color:#fff}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:linear-gradient(145deg,#111e34ee,#0a1424ee);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 18px 55px #0000003d}.metric small{color:var(--muted)}.metric strong{display:block;font-size:21px;margin-top:7px}.green{color:var(--g)}.red{color:var(--r)}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px;margin-top:15px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#091527;color:var(--text);outline:0}input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #6d5dfc20}input[type=date]{min-height:43px;appearance:auto;-webkit-appearance:auto}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}.table{overflow:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:6px}.day{min-height:76px;border:1px solid var(--line);border-radius:11px;padding:8px;background:#091527;cursor:pointer}.day .num{font-size:11px;color:var(--muted)}.day .amt{font-weight:800;margin-top:11px;font-size:12px;overflow:hidden;text-overflow:ellipsis}.pos{background:#21d4a316;border-color:#21d4a34d}.neg{background:#ff647c16;border-color:#ff647c4d}.week-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.week-day{padding:15px 10px;border:1px solid var(--line);border-radius:12px;background:#091527;text-align:center;cursor:pointer}.week-day b,.week-day small,.week-day span{display:block}.week-day small{color:var(--muted);margin-top:3px}.week-day span{font-weight:800;margin-top:8px}.month-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.month-card{min-width:0}.pill{padding:4px 8px;border-radius:99px;background:#ffffff0d;color:var(--muted);font-size:11px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#020812c4;display:grid;place-items:center;padding:16px;z-index:50}.modal.hidden{display:none!important}.modal>div{width:min(440px,100%);background:#12223b;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 90px #0008}.modal-actions{display:flex;gap:8px;margin-top:15px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#13243d;border:1px solid var(--line);padding:11px 15px;border-radius:12px;z-index:100;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{padding:14px}.top .primary{width:100%}.grid{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.week-day{padding:12px 5px}.week-day span{font-size:11px}.month-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.calendar{gap:4px}.day{min-height:62px;padding:6px}.day .amt{font-size:10px;margin-top:7px}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.month-grid{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.week-day{padding:10px 2px}.week-day b{font-size:11px}.week-day small{font-size:9px}.week-day span{font-size:10px}.calendar{gap:3px}.dow{font-size:9px}.day{min-height:56px;border-radius:8px}.day .num{font-size:10px}.day .amt{font-size:9px}.card{padding:14px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><h1>📒 Trading Journal</h1><div class="muted">Track your capital, daily P&amp;L and performance.</div></div><button class="btn primary" onclick="showModal()">＋ New Portfolio</button></header><div class="nav"><select id="portfolio" onchange="load()"></select><button data-view="dashboard" class="active" onclick="view('dashboard')">Dashboard</button><button data-view="daily" onclick="view('daily')">Daily</button><button data-view="weekly" onclick="view('weekly')">Weekly</button><button data-view="monthly" onclick="view('monthly')">Month</button></div><div id="dashboard"></div><div id="daily" class="hidden"></div><div id="weekly" class="hidden"></div><div id="monthly" class="hidden"></div></main><div id="modal" class="modal hidden"><div><h2>Create portfolio</h2><p class="muted">Set up an account to start tracking performance.</p><form id="pf"><label>Name<input id="pname" placeholder="Main Trading Account" required></label><br><label>Initial capital<input id="capital" type="number" min="0" step="any" placeholder="100000" required></label><br><label>Currency<select id="currency"><option>INR</option><option>USD</option><option>EUR</option></select></label><div class="modal-actions"><button class="btn primary" type="submit">Create Portfolio</button><button type="button" class="btn" onclick="hideModal()">Cancel</button></div></form></div></div><div id="toast" class="toast"></div><script>const $=x=>document.getElementById(x);let portfolios=[],current=null,data=null,active='dashboard',month=new Date(),week=new Date();const money=n=>new Intl.NumberFormat(current?.currency==='INR'?'en-IN':'en-US',{style:'currency',currency:current?.currency||'INR',maximumFractionDigits:2}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.error||'Request failed')}return r.status===204?null:r.json()}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2200)}async function init(){portfolios=await api('/api/portfolios');if(!portfolios.length){$('portfolio').innerHTML='<option>No portfolio yet</option>';showModal();return}setOptions();current=portfolios[0];$('portfolio').value=current.id;await load()}function setOptions(){$('portfolio').innerHTML=portfolios.map(p=>`<option value="${p.id}">${esc(p.name)} — ${new Intl.NumberFormat('en-IN',{style:'currency',currency:p.currency||'INR',maximumFractionDigits:0}).format(p.initial_capital)}</option>`).join('')}async function load(){current=portfolios.find(p=>p.id==$('portfolio').value)||current;if(!current)return;data=await api('/api/portfolios/'+current.id+'/summary');renderAll()}function nav(t,b){return `<section class="card"><div class="monthbar"><h2>${t}</h2></div>${b}</section>`}function stats(){return `<div class="cards"><div class="card metric"><small>Initial capital</small><strong>${money(current.initial_capital)}</strong></div><div class="card metric"><small>Current balance</small><strong class="${data.balance>=current.initial_capital?'green':'red'}">${money(data.balance)}</strong></div><div class="card metric"><small>Total P&amp;L</small><strong class="${data.netPnl>=0?'green':'red'}">${money(data.netPnl)}</strong></div><div class="card metric"><small>Total return</small><strong class="${data.totalReturnPct>=0?'green':'red'}">${data.totalReturnPct.toFixed(2)}%</strong></div><div class="card metric"><small>Winning days</small><strong>${data.winningDays}</strong></div><div class="card metric"><small>Losing days</small><strong>${data.losingDays}</strong></div></div>`}function renderDashboard(){let recent=data.entries.slice(-10).reverse();$('dashboard').innerHTML=stats()+`<div class="grid"><div>${nav('Quick entry',`<form id="entryForm" class="form"><label>Date<input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Daily P&amp;L<input id="amount" type="number" step="any" placeholder="+2500 or -1200" required></label><label class="full">Notes<textarea id="enotes" placeholder="Optional note"></textarea></label><button class="btn primary full">Save day</button></form><p class="muted">Saving the same date updates that day's result.</p>`)}</div><div>${nav('Recent performance',`<div class="table"><table><thead><tr><th>Date</th><th>P&amp;L</th><th>Balance</th><th>Return</th></tr></thead><tbody>${recent.length?recent.map(e=>`<tr><td>${e.date}</td><td class="${e.amount>=0?'green':'red'}">${money(e.amount)}</td><td>${money(e.balance)}</td><td>${e.returnPct.toFixed(2)}%</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No daily entries yet.</td></tr>'}</tbody></table></div>`)}</div></div>`;$('entryForm').onsubmit=saveEntry}function calendar(entries,y,m){let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),map=Object.fromEntries(entries.map(e=>[e.date,e]));let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=map[k];h+=`<div class="day ${e?(e.amount>0?'pos':e.amount<0?'neg':''):''}" onclick="pickDate('${k}')"><div class="num">${d}</div><div class="amt">${e?money(e.amount):'—'}</div></div>`}return `<div class="calendar">${h}</div>`}function renderDaily(){let y=month.getFullYear(),m=month.getMonth(),es=data.entries.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));$('daily').innerHTML=nav('Daily performance',`<div class="monthbar"><button onclick="moveMonth(-1)">←</button><b>${month.toLocaleString('en',{month:'long',year:'numeric'})}</b><button onclick="moveMonth(1)">→</button></div>${calendar(es,y,m)}<p class="muted">Tap a date to enter or update its P&amp;L.</p>`)}function weekStart(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}function renderWeekly(){let s=weekStart(week),keys=[];for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);keys.push(d.toISOString().slice(0,10))}let es=data.entries.filter(e=>keys.includes(e.date)),map=Object.fromEntries(es.map(e=>[e.date,e])),total=es.reduce((a,e)=>a+e.amount,0);$('weekly').innerHTML=nav('Weekly performance',`<div class="monthbar"><button onclick="moveWeek(-7)">←</button><b>${keys[0]} → ${keys[6]}</b><button onclick="moveWeek(7)">→</button></div><div class="week-grid">${keys.map(k=>{let e=map[k],d=new Date(k+'T00:00:00');return `<div class="week-day ${e?(e.amount>=0?'pos':'neg'):''}" onclick="pickDate('${k}')"><b>${d.toLocaleDateString('en',{weekday:'short'})}</b><small>${d.toLocaleDateString('en',{day:'2-digit',month:'short'})}</small><span>${e?money(e.amount):'—'}</span></div>`}).join('')}</div><h3 class="${total>=0?'green':'red'}">Week P&amp;L: ${money(total)}</h3>`)}function renderMonthly(){let groups={};data.entries.forEach(e=>{let k=e.date.slice(0,7);(groups[k]??=[]).push(e)});let months=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));$('monthly').innerHTML=nav('Monthly performance',`<div class="month-grid">${months.length?months.map(([k,es])=>{let n=es.reduce((a,e)=>a+e.amount,0),w=es.filter(e=>e.amount>0).length,l=es.filter(e=>e.amount<0).length;return `<div class="card month-card"><div class="section-head"><b>${new Date(k+'-01T00:00:00').toLocaleString('en',{month:'long',year:'numeric'})}</b><span class="pill">${es.length} days</span></div><div class="metric"><strong class="${n>=0?'green':'red'}">${money(n)}</strong><small>${n>=0?'Profit':'Loss'} • ${w}W / ${l}L</small></div></div>`}).join(''):'<p class="muted">No monthly data yet.</p>'}</div><p class="muted">Every month with recorded performance is shown as its own card.</p>`)}function renderAll(){renderDashboard();renderDaily();renderWeekly();renderMonthly();view(active)}function view(v){active=v;['dashboard','daily','weekly','monthly'].forEach(x=>$(x).classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}async function saveEntry(e){e.preventDefault();try{await api('/api/portfolios/'+current.id+'/entries',{method:'POST',body:JSON.stringify({date:$('edate').value,amount:+$('amount').value,notes:$('enotes').value})});await load();toast('Daily performance saved')}catch(x){toast(x.message)}}function pickDate(k){view('dashboard');setTimeout(()=>{$('edate').value=k;$('amount').focus()},0)}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);renderDaily()}function moveWeek(n){week=new Date(week);week.setDate(week.getDate()+n);renderWeekly()}function showModal(){$('modal').classList.remove('hidden');setTimeout(()=>$('pname').focus(),50)}function hideModal(){$('modal').classList.add('hidden')}$('pf').onsubmit=async e=>{e.preventDefault();let b=e.submitter;try{b.disabled=true;let p=await api('/api/portfolios',{method:'POST',body:JSON.stringify({name:$('pname').value.trim(),initialCapital:+$('capital').value,currency:$('currency').value})});hideModal();$('pf').reset();portfolios=await api('/api/portfolios');setOptions();current=portfolios.find(x=>x.id===p.id)||p;$('portfolio').value=current.id;await load();toast('Portfolio created successfully')}catch(x){toast(x.message)}finally{b.disabled=false}};init().catch(x=>toast(x.message));</script></body></html>
